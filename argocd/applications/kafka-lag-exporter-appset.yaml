apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kafka-lag-exporter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  generators:
    - list:
        elements:
          - cluster: dev
            url: https://kubernetes.default.svc
            path: apps/overlays/dev
            namespace: kafka-dev
          - cluster: prod
            url: https://kubernetes.default.svc
            path: apps/overlays/prod
            namespace: kafka
  template:
    metadata:
      name: "kafka-lag-exporter-{{cluster}}"
    spec:
      project: kafka-platform
      source:
        repoURL: https://github.com/aliaksandr-budnikau/kafka-lag-exporter-gitops.git
        targetRevision: main
        path: "{{path}}"
      destination:
        server: "{{url}}"
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true