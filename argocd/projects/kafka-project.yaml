apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kafka-platform
  namespace: argocd
spec:
  description: Kafka platform and observability
  sourceRepos:
    - https://github.com/aliaksandr-budnikau/kafka-lag-exporter-gitops.git
    - https://strimzi.io/charts/
    - https://prometheus-community.github.io/helm-charts
  destinations:
    - namespace: kafka
      server: https://kubernetes.default.svc
    - namespace: kafka-dev
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: argoproj.io
      kind: Application
    - group: argoproj.io
      kind: ApplicationSet
  namespaceResourceWhitelist:
    - group: "kafka.strimzi.io"
      kind: "*"
    - group: "monitoring.coreos.com"
      kind: "*"
    - group: ""
      kind: "*"
    - group: "apps"
      kind: "*"
    - group: argoproj.io
      kind: Application
    - group: argoproj.io
      kind: ApplicationSet
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
  orphanedResources:
    warn: true