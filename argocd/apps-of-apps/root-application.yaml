apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-kafka-apps
  namespace: argocd
spec:
  project: kafka-platform
  source:
    repoURL: https://github.com/aliaksandr-budnikau/kafka-lag-exporter-gitops.git
    targetRevision: main
    path: argocd/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true