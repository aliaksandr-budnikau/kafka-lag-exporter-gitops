apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kafka

namePrefix: prod-

labels:
  environment: prod

resources:
  - ../../base
  - ../../../secrets/kafka-credentials.yaml

images:
  - name: kafka-lag-exporter
    newTag: v1.2.0

patches:
  - path: patch-replicas.yaml
  - path: patch-resources.yaml